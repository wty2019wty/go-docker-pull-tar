# CI：每次 push / PR 自动执行格式检查、静态分析、单元测试与交叉编译冒烟。
name: CI

on:
  # 所有分支的 push 均触发
  push:
  # 所有目标分支的 PR 均触发
  pull_request:

permissions:
  contents: read

jobs:
  # 格式检查 + 静态分析 + 单元测试（三平台）
  test:
    name: 测试（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 代码格式检查（gofmt）
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未按 gofmt 格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: 静态分析（go vet）
        run: go vet ./...

      - name: 单元测试
        run: go test -race -count=1 ./...

      - name: 构建冒烟（含版本注入）
        run: go build -trimpath -ldflags "-s -w -X main.Version=ci-test" -o gdockerpull${{ runner.os == 'Windows' && '.exe' || '' }} .

  # 交叉编译冒烟：提前发现各目标平台的编译问题
  cross-build:
    name: 交叉编译（${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 编译
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -X main.Version=ci-test" -o /dev/null .
